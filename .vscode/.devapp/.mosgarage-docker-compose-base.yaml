name: ${COMPOSE_PROJECT_NAME}
  #mosgarage-generated
services:
  
  db:
    container_name: mosgarage-${SITENAME}-db
    build:
      context: './.dbimageBuild'
      args:
        BASE_IMAGE: $MOSGARAGE_DBIMAGE
        username: 'dev'
        uid: '1000'
        gid: '1000'
    image: ${MOSGARAGE_DBIMAGE}-${MOSGARAGE_SITENAME}-built
    cap_add:
      - SYS_NICE
    stop_grace_period: 60s
    working_dir: "/home/dev"
    volumes:
      - type: "volume"
        source: "database"
        target: "/var/lib/mysql"
        volume:
          nocopy: true
       
      # On db container mosgarage_config is mounted rw so we can create snapshots
      - .:/mnt/mosgarage_config
      - ./db_snapshots:/mnt/snapshots
       
      - mosgarage-global-cache:/mnt/mosgarage-global-cache
    restart: "no"

    user: '$MOSGARAGE_UID:$MOSGARAGE_GID'
    hostname: mosgarage-db
    ports:
      - "127.0.0.1:$MOSGARAGE_HOST_DB_PORT:3306"
    labels:
      com.mosgarage.site-name: ${SITENAME}
      com.mosgarage.platform: mosgarage
      com.mosgarage.app-type: php
      com.mosgarage.approot: $APPROOT
    environment:
      - COLUMNS
      - BITNAMI_VOLUME_DIR=
      - MOSGARAGE_DATABASE
      - MOSGARAGE_DATABASE_FAMILY
      - MOSGARAGE_GID
      - MOSGARAGE_GOARCH
      - MOSGARAGE_GOOS
      - MOSGARAGE_HOSTNAME
      - MOSGARAGE_PHP_VERSION
      - MOSGARAGE_PRIMARY_URL
      - MOSGARAGE_PRIMARY_URL_PORT
      - MOSGARAGE_PRIMARY_URL_WITHOUT_PORT
      - MOSGARAGE_PROJECT
      - MOSGARAGE_PROJECT_TYPE
      - MOSGARAGE_ROUTER_HTTP_PORT
      - MOSGARAGE_ROUTER_HTTPS_PORT
      - MOSGARAGE_SCHEME
      - MOSGARAGE_SITENAME
      - MOSGARAGE_TLD
      - MOSGARAGE_UID
      - MOSGARAGE_USER
      - MOSGARAGE_VERSION
      - DOCKER_IP=127.0.0.1
      - IS_MOSGARAGE_PROJECT=true
      - LINES
      - MYSQL_HISTFILE=/mnt/mosgarage-global-cache/mysqlhistory/${MOSGARAGE_SITENAME}-db/mysql_history
      - PGDATABASE=db
      - PGHOST=127.0.0.1
      - PGPASSWORD=db
      - PGUSER=db
      - POSTGRES_PASSWORD=db
      - POSTGRES_USER=db
      - POSTGRES_DB=db
      - TZ=
      - USER=dev
    command: ${MOSGARAGE_DB_CONTAINER_COMMAND}
    healthcheck:
      interval: "1s"
      retries: 70
      start_period: "240s"
      start_interval: "1s"
      timeout: "70s"
   

  web:
    container_name: mosgarage-${MOSGARAGE_SITENAME}-web
    build:
      context: './.webimageBuild'
      args:
        BASE_IMAGE: $MOSGARAGE_WEBIMAGE
        username: 'dev'
        uid: '1000'
        gid: '1000'
        MOSGARAGE_PHP_VERSION: ${MOSGARAGE_PHP_VERSION}
        MOSGARAGE_DATABASE: ${MOSGARAGE_DATABASE}
    image: ${MOSGARAGE_WEBIMAGE}-${MOSGARAGE_SITENAME}-built
    command: /pre-start.sh

    networks: ["default", "mosgarage_default"]
    cap_add:
      - SYS_PTRACE
    working_dir: "/var/www/html/"

    

    volumes:
       
      
      # For mutagen, mount a directory higher in /var/www so that we can use
      # stageMode: "neighboring"
      - type: volume
        source: project_mutagen
        target: /var/www
        volume:
          nocopy: true
      # This second mutagen mount is only to make just the volume available so it can be chowned
      # without accidentally also hitting docker mounts
      - type: volume
        source: project_mutagen
        target: /tmp/project_mutagen
        volume:
          nocopy: true
      - .:/mnt/mosgarage_config:ro
      - ./xhprof:/usr/local/bin/xhprof:rw
      
      - ../.git:/var/www/html/.git:rw
      - mosgarage-global-cache:/mnt/mosgarage-global-cache
      - mosgarage-ssh-agent_socket_dir:/home/.ssh-agent

    restart: "no"
    user: '$mosgarage_UID:$MOSGARAGE_GID'
    hostname: mosgarage-web

    ports:
      - "127.0.0.1:$MOSGARAGE_HOST_HTTP_PORT:80"
      - "127.0.0.1:$MOSGARAGE_HOST_HTTPS_PORT:443"
      - "127.0.0.1::8025"

    environment:
    - COLUMNS
    - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    - COREPACK_HOME=/mnt/mosgarage-global-cache/corepack
    - DOCROOT=${MOSGARAGE_DOCROOT}
    - MOSGARAGE_APPROOT=/var/www/html
    - MOSGARAGE_COMPOSER_ROOT
    - MOSGARAGE_DATABASE
    - MOSGARAGE_DOCROOT
    - MOSGARAGE_DATABASE_FAMILY
    - MOSGARAGE_GID
    - MOSGARAGE_GOARCH
    - MOSGARAGE_GOOS
    - MOSGARAGE_HOSTNAME
    - MOSGARAGE_MUTAGEN_ENABLED
    - MOSGARAGE_PHP_VERSION
    - MOSGARAGE_PRIMARY_URL
    - MOSGARAGE_PRIMARY_URL_PORT
    - MOSGARAGE_PRIMARY_URL_WITHOUT_PORT
    - MOSGARAGE_PROJECT
    - MOSGARAGE_PROJECT_TYPE
    - MOSGARAGE_ROUTER_HTTP_PORT
    - MOSGARAGE_ROUTER_HTTPS_PORT
    - MOSGARAGE_SCHEME
    - MOSGARAGE_SITENAME
    - MOSGARAGE_TLD
    - MOSGARAGE_UID
    - MOSGARAGE_USER
    - MOSGARAGE_FILES_DIR
    - MOSGARAGE_FILES_DIRS
    - MOSGARAGE_WEB_ENTRYPOINT=/mnt/mosgarage_config/web-entrypoint.d
    - MOSGARAGE_WEBSERVER_TYPE
    - MOSGARAGE_XDEBUG_ENABLED
    - MOSGARAGE_XHPROF_MODE
    - MOSGARAGE_VERSION
    - DEPLOY_NAME=local
    
    - DRUSH_OPTIONS_URI=$MOSGARAGE_PRIMARY_URL
    
    - DOCKER_IP=127.0.0.1
    # HTTP_EXPOSE allows for ports accepting HTTP traffic to be accessible from <site>.MOSGARAGE.site:<port>
    # To expose a container port to a different host port, define the port as hostPort:containerPort
    # You can optionally expose an HTTPS port option for any ports defined in HTTP_EXPOSE.
    # To expose an HTTPS port, define the port as securePort:containerPort.
    
    - HTTP_EXPOSE=${MOSGARAGE_ROUTER_HTTP_PORT}:80,${MOSGARAGE_MAILPIT_PORT}:8025
    - HTTPS_EXPOSE=${MOSGARAGE_ROUTER_HTTPS_PORT}:80,${MOSGARAGE_MAILPIT_HTTPS_PORT}:8025
    
    - IS_MOSGARAGE_PROJECT=true
    - LINES
    - MYSQL_HISTFILE=/mnt/mosgarage-global-cache/mysqlhistory/${MOSGARAGE_SITENAME}-web/mysql_history
    - NODE_EXTRA_CA_CERTS=/mnt/mosgarage-global-cache/mkcert/rootCA.pem
    - npm_config_cache=/mnt/mosgarage-global-cache/npm
    - PGDATABASE=db
    - PGHOST=db
    - PGPASSWORD=db
    - PGUSER=db
    - PHP_IDE_CONFIG=serverName=${MOSGARAGE_SITENAME}.${MOSGARAGE_TLD}
    - SSH_AUTH_SOCK=/home/.ssh-agent/socket
    - TZ=
    - USER=dev
    - VIRTUAL_HOST=${MOSGARAGE_HOSTNAME}
    # This timeout is used for the web container's /start.sh,
    # it should be divided by the number of times it's going to be used.
    # The total timeout must be less than the default_container_timeout,
    # that's why we subtract 5 seconds to make sure we didn't hit exactly.
    # Currently used in 2 places: n-install.sh, install_nvm.sh
    - START_SCRIPT_TIMEOUT=117
    
    labels:
      com.mosgarage.site-name: ${MOSGARAGE_SITENAME}
      com.mosgarage.platform: mosgarage
      com.mosgarage.app-type: php
      com.mosgarage.approot: $MOSGARAGE_APPROOT

    healthcheck:
      interval: "1s"
      retries: 70
      start_period: "240s"
      start_interval: "1s"
      timeout: "70s"
  
  xhgui:
    image: mosgarage/mosgarage-xhgui:v1.24.10
    container_name: mosgarage-${MOSGARAGE_SITENAME}-xhgui
    labels:
      com.mosgarage.site-name: ${MOSGARAGE_SITENAME}
      com.mosgarage.approot: $MOSGARAGE_APPROOT
    profiles:
      - xhgui
    restart: "no"
    

    environment:
      - VIRTUAL_HOST=$MOSGARAGE_HOSTNAME
      - HTTP_EXPOSE=8143:80
      - HTTPS_EXPOSE=8142:80
      - XHGUI_SAVE_HANDLER=pdo
      - MOSGARAGE_DATABASE_FAMILY=${MOSGARAGE_DATABASE_FAMILY}
      - XHGUI_PDO_USER=db
      - XHGUI_PDO_PASS=db
      - TZ=
    depends_on:
      - db
    x-mosgarage:
      describe-url-port: "Launch: mosgarage xhgui"
networks:
  mosgarage_default:
    name: mosgarage_default
    external: true
  default:
    name: ${COMPOSE_PROJECT_NAME}_default
    labels:
      com.mosgarage.platform: mosgarage

volumes:
  
  database:
    name: "mosgarage-mariadb"
    external: true
   

  
  mosgarage-ssh-agent_socket_dir:
    external: true
  
  mosgarage-global-cache:
    name: mosgarage-global-cache
    external: true
  
  
  
  project_mutagen:
    name: mosgarage_project_mutagen
    external: true

  
