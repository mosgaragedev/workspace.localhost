services:

  mosgarage-containers:
    image: mosgarage-containers:latest
    container_mosgarage: mosgarage-containers
    restart: unless-stopped
    ports:
      - 8080:80
    expose:
      - 80
    environment:
      YOURLS_SITE: https://dev.mosgarage.xyz # please adjust to your domain
      YOURLS_USER: dev # please adjust
      YOURLS_PASS: Password123. # please adjust
      YOURLS_DB_HOST: mysql
      YOURLS_DB_USER: mosgarage-containers
      YOURLS_DB_NAME: mosgarage-containers
      YOURLS_DB_PASS: Password123. # please adjust
    volumes:
      - ./security.conf:/etc/apache2/conf-enabled/security.conf:ro      
    #networks:
    #  - proxy
    #labels:
    #  - traefik.enable=true
    #  - traefik.http.routers.mosgarage-containers.rule=Host(`s.ptf.one`)
    #  - traefik.http.services.mosgarage-containers.loadbalancer.server.port=80
    #  - traefik.docker.network=proxy
    #  # Part for optional traefik middlewares
    #  - traefik.http.routers.mosgarage.middlewares=local-ipwhitelist@file,authelia@docker     

  mysql:
    image: mysql:latest
    container_name: mosgarage-containers-db
    restart: unless-stopped
    expose:
      - 3306
    environment:
      MYSQL_DATABASE: mosgarage-containers
      MYSQL_USER: mosgarage-containers
      MYSQL_PASSWORD: very-secure-database-password # please adjust
      MYSQL_ROOT_PASSWORD: very-secure-database-root-password # please adjust
    volumes:
      - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes/mosgarage-containers/mysql:/var/lib/mysql
    #networks:
    #  - proxy

#networks:
